<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pokémon Survivor (Go version)</title>
<style>
html,body{margin:0;height:100%;background:#10141f;overflow:hidden;color:#cfd6e6;font:15px system-ui,sans-serif}
#load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px}
#bar{width:260px;height:8px;border-radius:4px;background:#232a3c;overflow:hidden}#bar i{display:block;height:100%;width:0;background:#ffd04a}
#links{position:fixed;left:0;right:0;bottom:14px;text-align:center;font-size:13px;color:#8d96ad}
#links a{color:#9fe8ff;text-decoration:none;margin:0 10px}
canvas{display:block}
</style>
</head>
<body>
<div id="load"><b>Pokémon Survivor</b><div id="bar"><i></i></div><span id="msg">Loading…</span>
<div id="links"><a href="https://github.com/TxHandles/pokemon-survivor/releases/latest/download/PokemonSurvivor.exe">Download for Windows</a> · <a href="../">Web version</a> · <a href="https://github.com/TxHandles/pokemon-survivor">Source</a></div></div>
<script src="wasm_exec.js"></script>
<script>
// music lives next to the web version's page when this build is served from /go/
window.MUSIC_BASE=location.pathname.indexOf('/go/')>=0?'../music/':'music/';
(async()=>{
  const go=new Go(),bar=document.querySelector('#bar i'),msg=document.getElementById('msg');
  async function load(url,gz){
    const r=await fetch(url);if(!r.ok)throw new Error(url+': '+r.status);
    const len=+r.headers.get('content-length')||0,rd=r.body.getReader(),parts=[];let got=0;
    for(;;){const {done,value}=await rd.read();if(done)break;parts.push(value);got+=value.length;if(len)bar.style.width=(got/len*100)+'%'}
    const blob=new Blob(parts);
    if(!gz)return blob.arrayBuffer();
    return new Response(blob.stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer();
  }
  try{
    let buf;
    if('DecompressionStream' in window){try{buf=await load('game.wasm.gz',true)}catch(e){buf=null}}
    if(!buf)buf=await load('game.wasm',false);
    const {instance}=await WebAssembly.instantiate(buf,go.importObject);
    document.getElementById('load').remove();go.run(instance);
  }catch(e){msg.textContent='Could not start: '+e}
})();
</script>
</body>
</html>
