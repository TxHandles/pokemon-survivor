name: Go build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: go test ./engine/content ./engine/sim ./engine/meta ./engine/synth ./engine/lockstep ./engine/net
      - name: Cross-target determinism (native vs wasm)
        run: ./tools/crosscheck.sh
      - name: Build Windows + web
        run: ./tools/build_go.sh
      - uses: actions/upload-artifact@v4
        with:
          name: PokemonSurvivor-windows
          path: build/windows/PokemonSurvivor.exe
      - uses: actions/upload-artifact@v4
        with:
          name: PokemonSurvivor-web
          path: build/web/
      - name: Publish the browser build to the site (go/)
        if: github.ref == 'refs/heads/main'
        run: |
          ./tools/site_go.sh
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add go
          if git diff --cached --quiet; then echo "site unchanged"; else
            git commit -m "Site: update the Go browser build (${GITHUB_SHA::7}) [skip ci]"
            git push
          fi
      - name: Version
        id: ver
        run: echo "v=$(tr -d ' \n' < VERSION)" >> "$GITHUB_OUTPUT"
      - name: Release (the go-v<VERSION> release always carries the current main build)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: go-v${{ steps.ver.outputs.v }}
          name: Pokémon Survivor ${{ steps.ver.outputs.v }} (Windows)
          body: |
            Windows build of the Go version. Download `PokemonSurvivor.exe` and run it (Windows may warn
            about an unknown publisher the first time: More info → Run anyway). The browser version is at
            https://txhandles.github.io/pokemon-survivor/go/ and the original web game at
            https://txhandles.github.io/pokemon-survivor/
          files: build/windows/PokemonSurvivor.exe
