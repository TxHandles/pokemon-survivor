name: Go build

on:
  push:
    branches: [main]
    paths: ['**.go', 'go.mod', 'go.sum', 'data/**', 'web/**', 'tools/build_go.sh', '.github/workflows/go-build.yml']
    tags: ['go-v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test simulation
        run: go test ./engine/content ./engine/sim
      - name: Build Windows + web
        run: ./tools/build_go.sh
      - uses: actions/upload-artifact@v4
        with:
          name: PokemonSurvivor-windows
          path: build/windows/PokemonSurvivor.exe
      - uses: actions/upload-artifact@v4
        with:
          name: PokemonSurvivor-web
          path: build/web/
      - name: Release (tags only)
        if: startsWith(github.ref, 'refs/tags/go-v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/windows/PokemonSurvivor.exe
